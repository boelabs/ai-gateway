name: Bug report
description: Report a problem with the gateway or the dashboard
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Do **not** include real API keys, `.env` contents, or production
        connection strings. Security vulnerabilities are never reported here: see SECURITY.md.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability (those are reported privately, see SECURITY.md).
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Endpoint, request body (redacted), provider or adapter, and the response.
      placeholder: |
        1. POST /v1/chat/completions with model "..."
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Git commit SHA or release tag.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Bun version (`bun --version`), Postgres and Redis versions, OS, and how it is deployed (Docker, bare metal, …).
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redacted logs or operation details. Include the `x-request-id` if you have it.
      render: shell
